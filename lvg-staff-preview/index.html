<!doctype html>
<html lang="it">
<head>

<meta name="theme-color" content="#f7f2eb" />
<title>LVG Staff Preview</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#211c18;background:#f7f2eb;--o:#ef6c25;--od:#d95816;--mut:#756c65;--line:#e7ded5;--green:#278653;--yellow:#a96500;--red:#c94c46}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#fffaf3,#f7f2eb);min-height:100vh}button,input{font:inherit}button{cursor:pointer}.header{position:sticky;top:0;z-index:20;min-height:76px;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;background:#fffdfaf2;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:15px;background:var(--o);color:#fff;display:grid;place-items:center;font-weight:950}.brand b,.brand small{display:block}.brand b{font-size:16px}.brand small{color:var(--o);font-size:10px;letter-spacing:.17em;font-weight:950}.avatar{width:42px;height:42px;border-radius:50%;background:#2d2925;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:900}.page{width:min(1100px,calc(100vw - 26px));margin:auto;padding:24px 0 110px}.hero{padding:30px;border-radius:26px;background:linear-gradient(135deg,#292522,#493d34);color:#fff}.eyebrow{color:var(--o);font-size:10px;letter-spacing:.18em;font-weight:950}.hero h1,.title h1{font-size:clamp(34px,9vw,58px);line-height:.98;letter-spacing:-.05em;margin:8px 0 14px}.hero p{color:#ddd5ce;line-height:1.5;margin:0 0 22px}.primary,.secondary{min-height:54px;border:0;border-radius:15px;padding:0 20px;font-weight:900}.primary{background:var(--o);color:#fff}.secondary{background:#eee7df;color:#352f2b}.full{width:100%}.dash{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.dash button{min-height:112px;border:1px solid var(--line);background:#fff;border-radius:20px;padding:16px;text-align:left}.dash .icon{display:block;font-size:24px;margin-bottom:10px}.dash strong,.dash small{display:block}.dash small{color:var(--mut);margin-top:4px;line-height:1.3}.accent{background:#fff4e9!important;border-color:#f0bf95!important}.topline,.title-row,.section-head,.summary-head,.live-head{display:flex;align-items:center;justify-content:space-between;gap:14px}.back{border:0;background:transparent;font-weight:900;color:#625a53;padding:8px 0}.pill{background:#eee7df;padding:8px 12px;border-radius:999px;font-size:12px;font-weight:900}.progress-track{height:7px;border-radius:999px;background:#eadfd5;overflow:hidden;margin:14px 0 20px}.progress{height:100%;background:var(--o)}.count{min-width:110px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:9px 12px;text-align:center}.count b,.count span,.count small{display:block}.count b{font-size:24px;color:var(--o)}.count span{font-size:10px;color:var(--mut);font-weight:900}.count small{font-size:9px;color:#8a7f76;margin-top:4px}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#eae3db;padding:5px;border-radius:15px;margin-top:18px;gap:4px}.tab{border:0;background:transparent;min-height:46px;border-radius:11px;font-weight:900}.tab.active{background:#fff;box-shadow:0 4px 14px #0001}.tab em{font-style:normal;margin-left:6px;font-size:10px;background:#ddd2c7;border-radius:999px;padding:2px 7px}.hint{margin-top:10px;padding:11px 13px;background:#fff3df;color:#785318;border-radius:12px;font-size:12px}.search{margin:18px 0;min-height:56px;border:1px solid var(--line);background:#fff;border-radius:16px;display:flex;align-items:center;padding:0 15px;gap:9px}.search input{border:0;outline:0;flex:1;background:transparent}.section-head h2{margin:0;font-size:14px}.section-head span{font-size:10px;color:var(--mut);font-weight:900}.quick{display:flex;gap:8px;overflow-x:auto;margin:10px 0 24px;padding-bottom:4px}.chip{flex:0 0 auto;max-width:230px;min-height:40px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 12px;font-size:11px;font-weight:800}.chip.sel{border-color:var(--o);background:#fff2e9;color:var(--od)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:12px}.card{border:2px solid transparent;background:transparent;border-radius:17px;padding:0;text-align:left;color:#211c18;overflow:hidden}.card.sel{border-color:var(--o);background:#fff3ea}.img{aspect-ratio:1;border-radius:14px;background:linear-gradient(145deg,#f1e5d6,#e2d4c3);display:grid;place-items:center;position:relative;font-size:42px}.placeholder{background:repeating-linear-gradient(135deg,#eee8e1,#eee8e1 10px,#e8e1da 10px,#e8e1da 20px);font-size:30px}.placeholder small{position:absolute;bottom:10px;font-size:8px;font-weight:900;color:#7d736a}.check{position:absolute;right:7px;top:7px;background:var(--o);color:#fff;border-radius:50%;width:27px;height:27px;display:grid;place-items:center;font-size:14px}.name{padding:8px 4px;min-height:44px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:11px;line-height:1.3;font-weight:800}.add{width:100%;margin-top:18px;min-height:55px;border:1.5px dashed #c6b7a9;background:#fff8;border-radius:15px;font-weight:900;color:#5f554d}.actions{position:fixed;bottom:0;left:0;right:0;z-index:15;min-height:84px;padding:12px 13px max(12px,env(safe-area-inset-bottom));display:flex;justify-content:flex-end;gap:10px;background:#fffdfaf2;border-top:1px solid var(--line);backdrop-filter:blur(15px)}.summary{max-width:780px;margin:auto}.summary-title{text-align:center}.summary-box{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}.summary-head{padding-bottom:9px;margin-bottom:5px;border-bottom:1px solid var(--line)}.summary-head h3{margin:0;font-size:13px;letter-spacing:.07em;text-transform:uppercase}.summary-head button{border:0;border-radius:9px;padding:7px 10px;background:#fff0e5;color:var(--od);font-weight:900}.sumitem{min-height:42px;border-bottom:1px solid #f1ece7;display:grid;grid-template-columns:30px 1fr 26px;align-items:center;font-size:13px}.sumitem:last-child{border-bottom:0}.stack{display:grid;gap:9px}.live-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.stat{background:#fff;border:1px solid var(--line);padding:14px;border-radius:16px}.stat b,.stat span{display:block}.stat b{font-size:23px}.stat span{font-size:11px;color:var(--mut)}.live-list{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden}.live-row{min-height:92px;padding:12px;display:grid;grid-template-columns:46px 1fr;gap:10px;align-items:center;border-bottom:1px solid #efe9e3}.mini{width:44px;height:44px;border-radius:12px;background:#f4ede6;display:grid;place-items:center;font-size:22px}.live-row small{display:block;color:var(--mut);margin-top:3px}.status{grid-column:2;width:100%;min-height:44px;border:0;border-radius:12px;font-weight:900;display:grid;grid-template-columns:18px 1fr 14px;align-items:center}.available{background:#e5f4ea;color:var(--green)}.wip{background:#fff0d7;color:var(--yellow)}.unavailable{background:#fde7e5;color:var(--red)}.modal-bg{position:fixed;inset:0;z-index:40;background:#211c187d;backdrop-filter:blur(5px);display:grid;place-items:end center;padding:12px}.modal{width:min(560px,100%);max-height:88vh;overflow:auto;background:#fffdfa;border-radius:24px 24px 16px 16px;padding:24px;box-shadow:0 30px 90px #0003}.modal h2{margin:8px 0 18px;font-size:26px}.modal label{font-size:11px;font-weight:900}.modal input{width:100%;min-height:52px;margin-top:7px;border:1px solid var(--line);border-radius:13px;padding:0 13px;outline:0}.readonly{margin-top:12px;padding:12px 13px;border-radius:12px;background:#f3eee8;display:flex;justify-content:space-between;font-size:11px}.dup{margin-top:15px;padding:14px;border:1px solid #f0c68d;border-radius:14px;background:#fff5e4}.dup p{font-weight:800}.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.status-options{display:grid;gap:9px}.status-opt{min-height:58px;border:2px solid transparent;border-radius:14px;padding:0 15px;display:grid;grid-template-columns:24px 1fr auto;align-items:center;text-align:left;font-weight:900}.status-opt.current{border-color:currentColor}.status-opt small{font-size:9px}.whatsapp{white-space:pre-wrap;background:#f2eee8;border-radius:14px;padding:15px;font-size:12px;line-height:1.5;max-height:55vh;overflow:auto}.toast{position:fixed;z-index:60;left:13px;right:13px;bottom:max(18px,env(safe-area-inset-bottom));background:#2d2925;color:#fff;border-radius:14px;padding:10px 12px 10px 16px;min-height:50px;display:none;align-items:center;gap:12px;box-shadow:0 16px 50px #0004;font-size:12px;font-weight:800}.toast.show{display:flex}.toast button{margin-left:auto;border:0;border-radius:8px;background:var(--o);color:#fff;font-weight:900;padding:8px 10px}@media(min-width:700px){.page{padding-top:34px}.grid{grid-template-columns:repeat(4,1fr)}.live-row{grid-template-columns:52px 1fr auto}.status{grid-column:auto;min-width:190px}.live-stats{grid-template-columns:repeat(4,1fr)}.modal-bg{place-items:center}.modal{border-radius:24px}.dash{grid-template-columns:repeat(4,1fr)}}@media(min-width:1024px){.grid{grid-template-columns:repeat(5,1fr)}}
</style>
</head>
<body>
<header class="header"><div class="brand"><div class="logo">LVG</div><div><b>Lo Verde Gastronom</b><small>STAFF</small></div></div><div class="avatar">LS</div></header>
<main id="app"></main><div id="overlay"></div><div id="toast" class="toast"><span id="toastText"></span><button id="undoBtn" style="display:none" onclick="undo()">ANNULLA</button></div>
<script>
const cats=['Condimenti','Primi','Secondi','Gateau','Frittate','Sfoglie','Contorni','Verdure','Frutta'];
const data=[['c1','Trapanese','Condimenti','🍅',1],['c2','Zucchine fritte','Condimenti','🥒',1],['c3','Piselli','Condimenti','🫛',0],['p1','Anelli al forno con ragù','Primi','🍝',1],['p2','Lasagne al ragù','Primi','🍝',1],['p3','Lasagne ricotta e spinaci','Primi','🥬',1],['p4','Anelli con melanzane, mozzarella e pomodoro','Primi','🍆',0],['p5','Lasagne pesto di zucchine, mandorle e ricotta','Primi','🥒',0],['p6','Bucatini con finocchietto e sarde','Primi','🐟',0],['p7','Tabulè di verdure','Primi','🥗',0,null,1],['s1','Petto di pollo panato e arrostito','Secondi','🍗',1,'Carne'],['s2','Petto di pollo alla pizzaiola','Secondi','🍅',1,'Carne'],['s3','Cotoletta di vitello','Secondi','🥩',0,'Carne'],['s4','Carne alla pizzaiola','Secondi','🍅',0,'Carne'],['s5','Polpette con patate','Secondi','🥔',1,'Carne'],['s6','Branzino gratinato al forno','Secondi','🐟',0,'Pesce'],['s7','Salmone fresco arrostito','Secondi','🐟',0,'Pesce'],['s8','Pesce spada gratinato al forno','Secondi','🐟',0,'Pesce'],['g1','Classico prosciutto e mozzarella','Gateau','🧀',1],['g2','Ragù','Gateau','🍝',0],['f1','Patate, cipolla e scamorza','Frittate','🥔',0],['f2','Zucchina e carota','Frittate','🥒',0],['sf1','Ricotta e spinaci','Sfoglie','🥬',1],['co1','Caponata di melanzane','Contorni','🍆',1],['co2','Parmigiana di melanzane','Contorni','🍆',1],['co3','Melanzane a cotoletta','Contorni','🍆',0],['co4','Patate al forno','Contorni','🥔',0],['co5','Zucca rossa in agrodolce','Contorni','🎃',0],['co6','Insalata vastasa','Contorni','🥗',0],['co7','Verdure grigliate','Contorni','🥒',0],['v1','Spinaci','Verdure','🥬',0],['v2','Fagiolina','Verdure','🫛',0],['v3','Zucchina lunga','Verdure','🥒',0],['fr1','Anguria dolce','Frutta','🍉',1]];
let screen='home',step=0,type='Carne',selected=new Set(['c1','p1','p2','s5','co2','fr1']),live={},last=null,custom=[],query='';
const app=document.getElementById('app'),overlay=document.getElementById('overlay');const all=()=>data.concat(custom);const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const sim=(a,b)=>{let A=new Set(norm(a).split(' ').filter(x=>x.length>2)),B=new Set(norm(b).split(' ').filter(x=>x.length>2));let i=[...A].filter(x=>B.has(x)).length,u=new Set([...A,...B]).size;return u?i/u:0};
function showToast(t,withUndo=false){document.getElementById('toastText').textContent=t;document.getElementById('undoBtn').style.display=withUndo?'block':'none';let x=document.getElementById('toast');x.classList.add('show');setTimeout(()=>x.classList.remove('show'),3200)}
function home(){app.innerHTML=`<div class="page"><section class="hero"><span class="eyebrow">OGGI</span><h1>Crea il menù di oggi</h1><p>Seleziona i piatti categoria per categoria. Puoi saltare ciò che oggi non serve.</p><button class="primary full" onclick="screen='wizard';step=0;render()">Crea il menù →</button></section><section class="dash"><button><span class="icon">📚</span><strong>Catalogo prodotti</strong><small>Tutti i piatti dello storico</small></button><button><span class="icon">🕘</span><strong>Storico menù</strong><small>Rivedi o duplica un vecchio menù</small></button><button class="accent"><span class="icon">🟠</span><strong>Da completare</strong><small>3 prodotti senza foto o emoji</small></button><button><span class="icon">⚙️</span><strong>Impostazioni</strong><small>Template e preferenze</small></button></section></div>`}
function visible(){return all().filter(x=>x[2]===cats[step]&&(cats[step]!=='Secondi'||x[5]===type)&&(!query||norm(x[1]).includes(norm(query))))}function catSelected(){return all().filter(x=>x[2]===cats[step]&&selected.has(x[0])).length}function secondCount(t){return all().filter(x=>x[2]==='Secondi'&&x[5]===t&&selected.has(x[0])).length}function toggle(id){selected.has(id)?selected.delete(id):selected.add(id);render()}
function wizard(){let items=visible(),pop=items.filter(x=>x[4]).slice(0,8),prog=((step+1)/cats.length)*100;app.innerHTML=`<div class="page"><div class="topline"><button class="back" onclick="back()">← Indietro</button><div class="pill">${step+1} di ${cats.length}</div></div><div class="progress-track"><div class="progress" style="width:${prog}%"></div></div><div class="title-row"><div class="title"><span class="eyebrow">SCEGLI I PIATTI</span><h1>${cats[step]}</h1></div><div class="count"><b>${catSelected()}</b><span>selezionati</span>${cats[step]==='Secondi'?`<small>Carne ${secondCount('Carne')} · Pesce ${secondCount('Pesce')}</small>`:''}</div></div>${cats[step]==='Secondi'?`<div class="tabs"><button class="tab ${type==='Carne'?'active':''}" onclick="type='Carne';render()">Carne <em>${secondCount('Carne')}</em></button><button class="tab ${type==='Pesce'?'active':''}" onclick="type='Pesce';render()">Pesce <em>${secondCount('Pesce')}</em></button></div><div class="hint">💡 Oggi di solito è giornata pesce. È solo un suggerimento.</div>`:''}<div class="search">⌕ <input value="${query.replace(/"/g,'&quot;')}" oninput="query=this.value;render()" placeholder="Cerca in ${cats[step].toLowerCase()}..."></div>${pop.length?`<div class="section-head"><h2>Più usati</h2><span>Scorciatoie</span></div><div class="quick">${pop.map(x=>`<button class="chip ${selected.has(x[0])?'sel':''}" onclick="toggle('${x[0]}')">${x[3]} ${x[1]} ${selected.has(x[0])?'✓':''}</button>`).join('')}</div>`:''}<div class="section-head"><h2>Tutti i ${cats[step].toLowerCase()}</h2><span>${items.length} prodotti</span></div><div class="grid">${items.map(card).join('')}</div><button class="add" onclick="openAdd()">＋ Nuovo piatto</button></div><div class="actions">${catSelected()===0?'<button class="secondary" onclick="next()">Salta categoria</button>':''}<button class="primary" onclick="next()">${step===cats.length-1?'Vai al riepilogo':'Avanti'} →</button></div>`}
function card(x){let miss=x[6];return `<button class="card ${selected.has(x[0])?'sel':''}" onclick="toggle('${x[0]}')"><div class="img ${miss?'placeholder':''}"><span>${miss?'🍽️':x[3]}</span>${miss?'<small>Foto da aggiungere</small>':''}${selected.has(x[0])?'<b class="check">✓</b>':''}</div><span class="name">${x[1]}</span></button>`}function back(){query='';if(step===0)screen='home';else step--;render()}function next(){query='';if(step===cats.length-1)screen='summary';else step++;render()}
function openAdd(){overlay.innerHTML=`<div class="modal-bg"><div class="modal"><span class="eyebrow">NUOVO PIATTO</span><h2>Aggiungi un prodotto</h2><label>Nome del piatto</label><input id="newName" placeholder="Es. Petto pollo pizzaiola"><div class="readonly"><span>Categoria</span><strong>${cats[step]}${cats[step]==='Secondi'?' · '+type:''}</strong></div><div id="dup"></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">Annulla</button><button class="primary" onclick="checkDup()">Continua</button></div></div></div>`;setTimeout(()=>document.getElementById('newName').focus(),50)}function closeModal(){overlay.innerHTML=''}
function checkDup(){let n=document.getElementById('newName').value.trim();if(!n)return;let c=all().filter(x=>x[2]===cats[step]&&(cats[step]!=='Secondi'||x[5]===type)).map(x=>[x,sim(n,x[1])]).sort((a,b)=>b[1]-a[1]);if(c[0]&&c[0][1]>=.42){let x=c[0][0];document.getElementById('dup').innerHTML=`<div class="dup"><strong>⚠️ Potrebbe esistere già</strong><p>${x[3]} ${x[1]}</p><div class="modal-actions"><button class="primary" onclick="useExisting('${x[0]}')">Usa questo</button><button class="secondary" onclick="createNew()">Crea comunque</button></div></div>`}else createNew()}function useExisting(id){selected.add(id);closeModal();render();showToast('Prodotto esistente selezionato')}function createNew(){let n=document.getElementById('newName').value.trim(),id='custom'+Date.now();custom.push([id,n,cats[step],'🍽️',0,cats[step]==='Secondi'?type:null,1]);selected.add(id);closeModal();render();showToast('Nuovo piatto aggiunto · da completare')}
function summary(){let blocks=cats.map((c,i)=>{let its=all().filter(x=>x[2]===c&&selected.has(x[0]));return its.length?`<section class="summary-box"><div class="summary-head"><h3>${c}</h3><button onclick="step=${i};screen='wizard';render()">Modifica</button></div>${its.map(x=>`<div class="sumitem"><span>${x[3]}</span><span>${x[1]}</span><span>☰</span></div>`).join('')}</section>`:''}).join('');app.innerHTML=`<div class="page summary"><div class="summary-title title"><span class="eyebrow">CONTROLLA PRIMA DI SALVARE</span><h1>Il menù di oggi</h1><p style="color:var(--mut)">${[...selected].length} piatti selezionati</p></div>${blocks}<div class="stack"><button class="secondary full" onclick="showWhatsapp()">Anteprima WhatsApp</button><button class="secondary full" onclick="screen='wizard';render()">← Modifica</button><button class="primary full" onclick="save()">Salva il menù ✓</button></div></div>`}
function save(){all().filter(x=>selected.has(x[0])).forEach(x=>live[x[0]]='available');screen='live';render();showToast('Menù salvato · Menù Live attivo')}
function liveScreen(){let it=all().filter(x=>selected.has(x[0])),ct=s=>it.filter(x=>(live[x[0]]||'available')===s).length;app.innerHTML=`<div class="page"><div class="live-head title"><div><span class="eyebrow">SERVIZIO IN CORSO</span><h1>Menù Live</h1></div><button class="secondary" onclick="screen='summary';render()">Modifica</button></div><div class="live-stats"><div class="stat"><b>${it.length}</b><span>prodotti</span></div><div class="stat"><b>${ct('available')}</b><span>disponibili</span></div><div class="stat"><b>${ct('wip')}</b><span>in preparazione</span></div><div class="stat"><b>${ct('unavailable')}</b><span>terminati</span></div></div><div class="live-list">${it.map(x=>{let s=live[x[0]]||'available',lab=s==='available'?'Disponibile':s==='wip'?'In preparazione':'Terminato';return `<div class="live-row"><div class="mini">${x[3]}</div><div><b>${x[1]}</b><small>${x[2]}${x[5]?' · '+x[5]:''}</small></div><button class="status ${s}" onclick="pickStatus('${x[0]}')"><span>●</span><span>${lab}</span><span>›</span></button></div>`}).join('')}</div><div class="stack" style="margin-top:14px"><button class="secondary full" onclick="showWhatsapp()">WhatsApp</button><button class="primary full" onclick="showToast('Menù pubblicato sul sito')">Pubblica sul sito</button></div></div>`}
function pickStatus(id){let x=all().find(y=>y[0]===id),cur=live[id]||'available';overlay.innerHTML=`<div class="modal-bg"><div class="modal"><span class="eyebrow">CAMBIA DISPONIBILITÀ</span><h2>${x[1]}</h2><div class="status-options">${[['available','Disponibile'],['wip','In preparazione'],['unavailable','Terminato']].map(a=>`<button class="status-opt ${a[0]} ${cur===a[0]?'current':''}" onclick="setStatus('${id}','${a[0]}')"><span>●</span><strong>${a[1]}</strong>${cur===a[0]?'<small>Stato attuale</small>':''}</button>`).join('')}</div><div class="modal-actions"><button class="secondary" style="grid-column:1/-1" onclick="closeModal()">Annulla</button></div></div></div>`}function setStatus(id,s){let prev=live[id]||'available';live[id]=s;last={id,prev};closeModal();render();let x=all().find(y=>y[0]===id);showToast(`${x[1]}: ${s==='available'?'Disponibile':s==='wip'?'In preparazione':'Terminato'}`,true)}function undo(){if(!last)return;live[last.id]=last.prev;last=null;render();showToast('Modifica annullata')}
function whatsapp(){const labels={Condimenti:'CONDIMENTI',Primi:'PRIMI',Gateau:'GATEAU',Frittate:'FRITTATA AL FORNO',Sfoglie:'SFOGLIA',Contorni:'CONTORNI',Verdure:'VERDURE SOLO BOLLITE',Frutta:'FRUTTA TAGLIATA IN VASCHETTA'};const lines=['🌞 *Buongiorno* da tutto lo staff di Lo Verde Gastronom,','ecco a voi il menù di oggi:',''];cats.forEach(c=>{const its=all().filter(x=>x[2]===c&&selected.has(x[0]));if(!its.length)return;if(c==='Secondi'){const fish=its.filter(x=>x[5]==='Pesce'),meat=its.filter(x=>x[5]==='Carne');if(fish.length){lines.push('*SECONDI DI PESCE*');fish.forEach(x=>lines.push(`${x[3]} ${x[1]}`));lines.push('')}if(meat.length){lines.push('*SECONDI DI CARNE*');meat.forEach(x=>lines.push(`${x[3]} ${x[1]}`));lines.push('')}return}lines.push(`*${labels[c]}*`);its.forEach(x=>lines.push(`${x[3]} ${x[1]}`));lines.push('')});lines.push('Vi auguriamo una Buonissima giornata! 😋🤗');return lines.join('\n')}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function showWhatsapp(){let t=whatsapp();overlay.innerHTML=`<div class="modal-bg"><div class="modal"><span class="eyebrow">ANTEPRIMA WHATSAPP</span><h2>Messaggio pronto</h2><div class="whatsapp">${esc(t)}</div><div class="modal-actions"><button class="secondary" onclick="closeModal()">Chiudi</button><button class="primary" onclick="copyWhatsapp()">Copia</button></div></div></div>`}async function copyWhatsapp(){let t=whatsapp();try{await navigator.clipboard.writeText(t);showToast('Messaggio copiato correttamente')}catch(e){let ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();showToast('Messaggio copiato correttamente')}}function render(){overlay.innerHTML='';if(screen==='home')home();else if(screen==='wizard')wizard();else if(screen==='summary')summary();else liveScreen()}render();
</script>
</body>
</html>
